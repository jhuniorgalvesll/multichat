# Arma los instaladores de Windows y Mac y los publica en Releases de este repositorio (jhuniorgalvesll/multichat).
# Las apps instaladas revisan ese repositorio y se actualizan solas.
# Se ejecuta al subir cambios a la rama `main`. Solo publica cuando la versión de package.json es nueva.
name: Publicar actualización

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ¿Hay versión nueva? Si la hay, crea el borrador donde se suben los instaladores (sin carreras).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.version.outputs.new }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: ¿Es una versión nueva?
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --json isDraft -q .isDraft 2>/dev/null | grep -q false; then
            echo "La versión v$VERSION ya está publicada: no hay nada nuevo que publicar."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Crear el borrador de la versión
        if: steps.version.outputs.new == 'true'
        run: |
          TAG=${{ steps.version.outputs.tag }}
          V=${TAG#v}
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "MultiChat Pro $TAG" --notes "Se instala sola desde MultiChat. Para instalar desde cero:
          - Windows: MultiChat-Setup-$V.exe
          - Mac con chip Apple (M1, M2, M3, M4): MultiChat-$V-arm64.dmg
          - Mac con Intel: MultiChat-$V-x64.dmg"

  windows:
    needs: prepare
    if: needs.prepare.outputs.new == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Armar y subir el instalador de Windows
        run: npx electron-builder --win --publish always

  mac:
    needs: prepare
    if: needs.prepare.outputs.new == 'true'
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Armar y subir el instalador de Mac (Apple e Intel)
        run: npx electron-builder --mac --publish always

  # Se publica cuando está el de Windows (si el de Mac falla, Windows igual recibe su actualización).
  publish:
    needs: [prepare, windows, mac]
    if: always() && needs.prepare.outputs.new == 'true' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publicar la versión
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
